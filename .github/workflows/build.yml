name: Build Capri APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unpack project
        run: unzip -q capri-project.zip -d proj
      - name: Build
        run: gradle -p proj assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
